<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>题材复盘 - A 股盘后题材与连板梯队</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="primary-nav" role="navigation" aria-label="主导航">
      <div class="brand"><span class="brand-icon" aria-hidden="true">📈</span><span class="brand-name">题材复盘</span></div>
      <nav class="nav-items" role="tablist">
        <a class="nav-item active" data-tab="topic-review" aria-current="page">题材复盘</a>
        <a class="nav-item disabled" data-tab="multi-day" aria-disabled="true" title="敬请期待">多日复盘</a>
        <a class="nav-item disabled" data-tab="data-manage" aria-disabled="true" title="敬请期待">数据管理</a>
      </nav>
    </header>

    <div class="date-nav" role="region" aria-label="交易日切换">
      <button class="date-btn" id="prevDay" type="button" aria-label="前一交易日">&laquo;</button>
      <div class="date-display" id="dateDisplay"><span class="date-main">------</span></div>
      <button class="date-btn" id="openCal" type="button" aria-label="打开日历">📅</button>
      <button class="date-btn" id="nextDay" type="button" aria-label="下一交易日">&raquo;</button>
      <dialog class="cal-dialog" id="calDialog" aria-label="交易日历">
        <div class="cal-grid" id="calGrid"></div>
      </dialog>
    </div>

    <div class="status-banner" id="statusBanner" role="status" aria-live="polite"></div>

    <main class="main" id="main">
      <section class="summary-grid skeleton-entity" id="skeletonSummary" hidden>
        <div class="summary-card skeleton"></div><div class="summary-card skeleton"></div>
        <div class="summary-card skeleton"></div><div class="summary-card skeleton"></div>
      </section>
      <section class="sentiment-panel skeleton-entity" id="skeletonSentiment" hidden>
        <span class="tag skeleton"></span><span class="tag skeleton"></span><span class="tag skeleton"></span>
        <span class="tag skeleton"></span><span class="tag skeleton"></span>
      </section>
      <div class="theme-list skeleton-entity" id="skeletonThemes" hidden>
        <section class="theme-card skeleton"></section><section class="theme-card skeleton"></section>
      </div>

      <section class="error-banner" id="errorBanner" hidden>
        <p>当日复盘数据加载失败</p><p class="error-sub">请检查网络后重试</p>
        <button class="btn-retry" id="btnRetry" type="button">重新加载</button>
      </section>

      <section class="empty-banner" id="emptyBanner" hidden>
        <p>该交易日暂无复盘数据</p><p class="empty-sub">可切换到其他交易日查看</p>
      </section>

      <section class="summary-grid" id="summaryGrid" hidden></section>
      <section class="sentiment-panel" id="sentimentPanel" hidden></section>
      <div class="theme-list" id="themeList" hidden></div>
    </main>

    <footer class="footer">
      <p>数据源 hithink-finance · 仅展示真实派生 · 不构成投资建议</p>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
